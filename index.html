<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#c00000">
<link rel="manifest" href="manifest.json">
<title>Rotas TGR - Motoristas</title>
<!-- versão offline PMTiles 100 km -->
<link rel="stylesheet" href="./leaflet.css">
<link rel="stylesheet" href="./maplibre-gl.css">
<style>
html,body{height:100%;margin:0;font-family:Arial,sans-serif;background:#f4f4f4}
#map{height:100%}
.topo{position:absolute;z-index:1000;left:12px;right:auto;top:12px;width:430px;max-width:calc(100vw - 24px);margin:0;background:white;padding:13px;border-radius:12px;box-shadow:0 2px 14px #0004;box-sizing:border-box}
h2{font-size:18px;margin:0 0 4px;color:#c00000}
.sub{font-size:12px;color:#666;margin-bottom:9px}
select{width:100%;font-size:16px;padding:10px;border:1px solid #bbb;border-radius:8px;background:#fff}
.info{display:none;margin-top:9px;padding-top:8px;border-top:1px solid #ddd;font-size:13px;line-height:1.45}
.pedidos{display:none;margin-top:10px;max-height:42vh;overflow:auto;border-top:1px solid #ddd;padding-top:8px}
.pedidosTitulo{font-size:14px;font-weight:bold}
.pedidosCabecalho{
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:7px;
  padding:6px 0;
  background:#fff
}
.togglePedidos{
  flex-shrink:0;
  border:1px solid #bbb;
  background:#fff;
  border-radius:6px;
  padding:7px 10px;
  font-size:11px;
  font-weight:bold;
  cursor:pointer;
  color:#333;
  box-shadow:0 1px 4px #0002
}
.togglePedidos:hover{background:#f1f1f1}
.pedidos.minimizada{max-height:none;overflow:hidden}
.pedidos.minimizada .pedidosConteudo{display:none}
.pedidos.minimizada .pedidosCabecalho{margin-bottom:0}
.pedidoItem{cursor:pointer;background:#fafafa;border:1px solid #ddd;border-radius:8px;padding:8px;margin-bottom:7px;font-size:12px;line-height:1.45}
.pedidoTopo{display:flex;justify-content:space-between;gap:8px;align-items:center}
.pedidoNum{font-weight:bold;color:#c00000;font-size:13px}
.pedidoPeso{font-weight:bold}
.statusBtns{display:flex;gap:8px;margin-top:7px}
.statusBtn,.pagamentoBtn{width:50%;border:0;border-radius:6px;padding:9px;font-weight:bold;cursor:pointer;color:#fff}
.statusBtn{background:#777}
.pagamentoBtn{background:#555}
.pagamentoBtn.indisponivel{background:#aaa;color:#f7f7f7;cursor:default}
.statusBtn.atendido{background:#148a2a}
.statusBtn.pendente{background:#777}
.num{background:#c00000;color:#fff;border:2px solid #fff;border-radius:16px;min-width:34px;height:30px;padding:0 5px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;font-weight:bold;box-shadow:0 1px 5px #0008}
.popup{font-size:13px;line-height:1.45;min-width:180px}
.gps{display:block;text-align:center;text-decoration:none;background:#148a2a;color:white!important;font-weight:bold;padding:9px;margin-top:8px;border-radius:7px}
@media(max-width:600px){.topo{left:8px;right:auto;top:8px;width:calc(100vw - 16px);max-width:none}}
.pixTela{position:fixed;inset:0;z-index:12000;background:#f4f4f4;display:none;align-items:center;justify-content:center;padding:18px;box-sizing:border-box}
.pixCard{width:min(430px,100%);background:#fff;border-radius:16px;padding:22px;box-shadow:0 8px 30px #0003;text-align:center}
.pixTopo{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.pixTopo h2{margin:0;font-size:18px;color:#222}
.pixFechar{border:1px solid #bbb;background:#fff;border-radius:7px;padding:8px 11px;font-weight:bold;cursor:pointer}
.pixValorLabel{font-size:13px;color:#666;margin-bottom:4px}
.pixValor{font-size:28px;font-weight:bold;color:#148a2a;margin-bottom:18px}
#pixQr{display:flex;align-items:center;justify-content:center;min-height:230px;margin:0 auto 14px}
#pixQr img,#pixQr canvas{max-width:230px!important;width:230px!important;height:230px!important}
.pixCopiar{display:block;width:100%;max-width:260px;margin:0 auto 12px;border:0;border-radius:8px;padding:11px 14px;background:#c00000;color:#fff;font-weight:bold;font-size:13px;cursor:pointer}
.pixCopiar.copiado{background:#148a2a}
.pixInstrucao{font-size:13px;line-height:1.45;color:#555;margin:0 auto;max-width:310px}
.pixAviso{font-size:14px;color:#b00000;line-height:1.45;padding:30px 10px}


  #telaInicial{
    position:fixed; inset:0; z-index:9999; background:#f4f4f4;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .inicioCard{
    width:min(430px,100%); background:#fff; border-radius:16px; padding:28px 22px;
    box-shadow:0 8px 30px rgba(0,0,0,.18); text-align:center;
  }
  .inicioLogo{width:164px;max-width:58%;height:auto;display:block;object-fit:contain;margin:0 auto 18px}
@media(max-width:600px){.inicioLogo{width:140px;max-width:55%}}
.inicioCard h1{margin:0 0 8px;font-size:23px}
  .inicioCard p{margin:0 0 20px;color:#666;font-size:13px}
  .inicioCard select{width:100%;padding:12px;border:1px solid #bbb;border-radius:8px;font-size:14px;background:#fff}
  .inicioCard button{width:100%;margin-top:12px;padding:12px;border:0;border-radius:8px;background:#c00000;color:#fff;font-weight:700;font-size:14px;cursor:pointer}
  .inicioCard button:disabled{opacity:.45;cursor:not-allowed}
  #trocarRota{position:fixed;top:12px;right:12px;z-index:1100;margin:0;padding:6px 9px;border:1px solid #bbb;border-radius:7px;background:rgba(255,255,255,.92);color:#555;font-size:10px;font-weight:bold;cursor:pointer;box-shadow:0 1px 5px #0002}


.offlineBar{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);z-index:13000;
background:#222;color:#fff;padding:8px 12px;border-radius:999px;font-size:11px;font-weight:bold;
box-shadow:0 2px 8px #0004;display:none}
.offlineBar.on{display:block}


.atualizarRotaBox{display:none;margin-top:8px;padding-top:8px;border-top:1px solid #ddd}
.atualizarRotaBtn{width:100%;border:0;border-radius:7px;padding:10px;background:#c00000;color:#fff;font-weight:bold;cursor:pointer}
.atualizarRotaBtn:disabled{opacity:.6;cursor:default}
.atualizacaoInfo{font-size:11px;color:#666;margin-top:7px;text-align:center;line-height:1.35}
.atualizacaoOk{color:#148a2a;font-weight:bold}
.atualizacaoErro{color:#b00000;font-weight:bold}


.atualizarSistemaInicial{
  display:block;
  width:100%;
  margin:24px 0 0;
  padding:18px 0 0;
  border-top:1px solid #e1e1e1;
  text-align:center;
}
.atualizarSistemaInicial .atualizarRotaBtn{
  display:block;
  width:82%;
  max-width:300px;
  margin:0 auto;
  padding:11px 14px;
  border-radius:8px;
}
.atualizarSistemaInicial .atualizacaoInfo{
  margin-top:8px;
}

.mapaStatus{position:fixed;left:50%;top:10px;transform:translateX(-50%);z-index:14000;
background:#222;color:#fff;padding:7px 11px;border-radius:999px;font:700 11px Arial;box-shadow:0 2px 8px #0004}
.mapaStatus.ok{background:#148a2a}.mapaStatus.erro{background:#b00000}
</style>
</head>

<script>
let dados=[];
let dadosPix=new Map();
let dadosClientes=new Map();

function parseCSV(texto){
  const linhas=[];
  let linha=[], campo='', aspas=false;
  for(let i=0;i<texto.length;i++){
    const c=texto[i];
    if(c==='"'){
      if(aspas && texto[i+1]==='"'){campo+='"'; i++;}
      else aspas=!aspas;
    }else if(c===';' && !aspas){
      linha.push(campo); campo='';
    }else if((c==='\n'||c==='\r') && !aspas){
      if(c==='\r' && texto[i+1]==='\n') i++;
      linha.push(campo); campo='';
      if(linha.some(v=>v!=='')) linhas.push(linha);
      linha=[];
    }else{
      campo+=c;
    }
  }
  if(campo!=='' || linha.length){
    linha.push(campo);
    if(linha.some(v=>v!=='')) linhas.push(linha);
  }
  return linhas;
}

function normalizarCodigoCliente(v){
  return String(v??'').trim().toUpperCase();
}


function normalizarCabecalho(v){
  return String(v??'')
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .trim().toLowerCase();
}

async function carregarBaseClientes(){
  try{
    const resposta=await fetch('Base de Clientes.xlsx?v='+Date.now(),{cache:'no-store'});
    if(!resposta.ok) throw new Error('HTTP '+resposta.status);
    const buffer=await resposta.arrayBuffer();
    const wb=XLSX.read(buffer,{type:'array'});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const linhas=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
    if(linhas.length<2) return;

    const cab=linhas[0].map(normalizarCabecalho);
    const posCod=cab.indexOf('cod');
    const posFantasia=cab.indexOf('fantasia');
    if(posCod<0 || posFantasia<0) throw new Error('Colunas cod/fantasia não encontradas.');

    dadosClientes.clear();
    linhas.slice(1).forEach(cols=>{
      const codigo=normalizarCodigoCliente(cols[posCod]);
      const fantasia=String(cols[posFantasia]??'').trim();
      if(codigo && fantasia && !dadosClientes.has(codigo)){
        dadosClientes.set(codigo,fantasia);
      }
    });
  }catch(erro){
    console.warn('Base de Clientes.xlsx não carregada:',erro);
  }
}

function nomeFantasiaCliente(codigo){
  return dadosClientes.get(normalizarCodigoCliente(codigo)) || 'Não informado';
}

async function carregarPix(){
  try{
    const resposta=await fetch('pix.csv?v='+Date.now(),{cache:'no-store'});
    if(!resposta.ok) throw new Error('HTTP '+resposta.status);
    let texto=(await resposta.text()).replace(/^\uFEFF/,'');
    const linhas=parseCSV(texto);
    if(linhas.length<2) return;
    const cab=linhas[0].map(x=>x.trim());
    const idx=nome=>cab.indexOf(nome);
    const pos={
      cliente:idx('CODIGO CLIENTE'),
      nf:idx('NF'),
      valor:idx('VALOR PIX'),
      payload:idx('PIX COPIA E COLA'),
      enderecoPix:3
    };
    if(Object.values(pos).some(v=>v<0)) return;
    dadosPix.clear();
    linhas.slice(1).forEach(cols=>{
      const cliente=normalizarCodigoCliente(cols[pos.cliente]);
      const payload=String(cols[pos.payload]??'').trim();
      if(!cliente || !payload) return;
      if(!dadosPix.has(cliente)){
        dadosPix.set(cliente,{
          nf:String(cols[pos.nf]??'').trim(),
          valor:String(cols[pos.valor]??'').trim(),
          payload,
          enderecoPix:String(cols[pos.enderecoPix]??'').trim()
        });
      }
    });
  }catch(erro){
    console.warn('pix.csv não carregado:',erro);
  }
}

async function carregarRotas(){
  try{
    const resposta=await fetch('rotas.csv?v='+Date.now(),{cache:'no-store'});
    if(!resposta.ok) throw new Error('HTTP '+resposta.status);

    let texto=(await resposta.text()).replace(/^\uFEFF/,'');
    const linhas=parseCSV(texto);
    if(linhas.length<2) throw new Error('CSV vazio.');

    const cab=linhas[0].map(x=>x.trim());
    const idx=nome=>cab.indexOf(nome);
    const pos={
      cliente:idx('CODIGO DO CLIENTE'),
      pedido:idx('NUMERO DO PEDIDO'),
      peso:idx('PESO'),
      rota:idx('ROTA'),
      motorista:idx('MOTORISTA'),
      cidade:idx('CIDADE'),
      lat:idx('LATITUDE'),
      lon:idx('LONGITUDE'),
      gps:idx('LINK GPS'),
      status:idx('STATUS DO PEDIDO')
    };

    const faltando=Object.entries(pos).filter(([k,v])=>v<0).map(([k])=>k);
    if(faltando.length) throw new Error('Colunas ausentes no CSV: '+faltando.join(', '));

    dados=linhas.slice(1).map(cols=>({
      cliente:String(cols[pos.cliente]??'').trim(),
      pedido:String(cols[pos.pedido]??'').trim(),
      peso:String(cols[pos.peso]??'').trim(),
      rota:String(cols[pos.rota]??'').trim(),
      motorista:String(cols[pos.motorista]??'').trim(),
      cidade:String(cols[pos.cidade]??'').trim(),
      lat:Number(String(cols[pos.lat]??'').replace(',','.')),
      lon:Number(String(cols[pos.lon]??'').replace(',','.')),
      gps:String(cols[pos.gps]??'').trim(),
      status:String(cols[pos.status]??'').trim()
    })).filter(x=>
      x.rota &&
      x.status.toLowerCase()==='roteirizado' &&
      Number.isFinite(x.lat) &&
      Number.isFinite(x.lon)
    );

    preencherPlacas();
  }catch(erro){
    const tela=document.getElementById('telaInicial');
    if(tela){
      tela.innerHTML='<div class="inicioCard"><h1>Rotas TGR</h1>'+
        '<p style="color:#b00000"><b>Não foi possível carregar rotas.csv.</b></p>'+
        '<p>Confirme se <b>index.html</b> e <b>rotas.csv</b> estão na mesma pasta publicada.</p>'+
        '<p style="font-size:12px;color:#666">'+esc(erro.message)+'</p></div>';
    }
  }
}

function preencherPlacas(){
  select.innerHTML='<option value="">Selecione a placa...</option>';
  const placas=[...new Set(dados.map(x=>x.rota))].sort();
  placas.forEach(p=>{
    const item=dados.find(x=>x.rota===p);
    const o=document.createElement('option');
    o.value=p;
    o.textContent=p+' — '+((item&&item.motorista)?item.motorista:'Não informado');
    select.appendChild(o);
  });

  const selectInicial=document.getElementById('placaInicial');
  const botao=document.getElementById('entrarRota');
  if(selectInicial && botao){
    selectInicial.innerHTML='<option value="">Selecione a placa...</option>';
    placas.forEach(p=>{
      const item=dados.find(x=>x.rota===p);
      const o=document.createElement('option');
      o.value=p;
      o.textContent=p+' — '+((item&&item.motorista)?item.motorista:'Não informado');
      selectInicial.appendChild(o);
    });
    selectInicial.onchange=function(){botao.disabled=!this.value;};
  }
}

const map=L.map('map',{
  minZoom:7,
  maxZoom:15
}).setView([-11.295674247278528,-41.85261931399753],9);

/*
  MAPA OFFLINE TGR
  O arquivo mapa_tgr_100km.pmtiles fica na mesma pasta deste index.html.
  A camada abaixo não consulta o servidor público de tiles do OpenStreetMap.
*/
const protocoloPmtiles=new pmtiles.Protocol({metadata:true});
maplibregl.addProtocol('pmtiles',protocoloPmtiles.tile);

const urlPmtiles=new URL('./mapa_tgr_100km.pmtiles',window.location.href).href;

const estiloOffline={
  version:8,
  sources:{
    tgr:{
      type:'vector',
      url:'pmtiles://'+urlPmtiles,
      attribution:'© OpenStreetMap contributors • Protomaps'
    }
  },
  layers:[
    {id:'fundo',type:'background',
      paint:{'background-color':'#efece5'}},
    {id:'terra',type:'fill',source:'tgr','source-layer':'earth',
      paint:{'fill-color':'#efece5'}},
    {id:'uso-solo',type:'fill',source:'tgr','source-layer':'landuse',
      paint:{'fill-color':'#e8eadf','fill-opacity':0.55}},
    {id:'agua',type:'fill',source:'tgr','source-layer':'water',
      paint:{'fill-color':'#b7d8e8'}},
    {id:'vias',type:'line',source:'tgr','source-layer':'roads',
      paint:{
        'line-color':'#ffffff',
        'line-width':['interpolate',['linear'],['zoom'],7,0.7,11,1.5,15,3.8]
      }},
    {id:'vias-contorno',type:'line',source:'tgr','source-layer':'roads',
      paint:{
        'line-color':'#b8a98f',
        'line-width':['interpolate',['linear'],['zoom'],7,0.25,11,0.45,15,0.8]
      }},
    {id:'predios',type:'fill',source:'tgr','source-layer':'buildings',
      minzoom:13,
      paint:{'fill-color':'#d2ccc2','fill-outline-color':'#bdb6ab'}}
  ]
};

const camadaMapaOffline=L.maplibreGL({
  style:estiloOffline,
  attributionControl:false
}).addTo(map);

setTimeout(()=>{
  try{
    const gl=camadaMapaOffline.getMaplibreMap();
    const status=document.getElementById('mapaStatus');
    if(!gl){
      status.textContent='Mapa offline não iniciou';
      status.className='mapaStatus erro';
      return;
    }
    gl.on('load',()=>{
      status.textContent='Mapa offline carregado';
      status.className='mapaStatus ok';
      setTimeout(()=>status.style.display='none',1800);
    });
    gl.on('error',(ev)=>{
      console.error('Erro do mapa offline:',ev && ev.error ? ev.error : ev);
      status.textContent='Erro ao carregar mapa offline';
      status.className='mapaStatus erro';
    });
  }catch(e){
    console.error(e);
    const status=document.getElementById('mapaStatus');
    status.textContent='Erro ao iniciar mapa offline';
    status.className='mapaStatus erro';
  }
},100);
let layer=L.layerGroup().addTo(map);
let marcadoresPorPedido=new Map();
let pedidosMinimizados=true;

const select=document.getElementById('placa');

map.on('click',()=>{
  if(select.value && !pedidosMinimizados){
    pedidosMinimizados=true;
    atualizarEstadoListaPedidos();
  }
});

function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function pesoNum(v){return Number(String(v??'0').replace(',','.'))||0;}
function chaveStatus(p){return 'statusPedidoTGR|'+p.rota+'|'+p.pedido+'|'+p.cliente;}
function getStatus(p){return localStorage.getItem(chaveStatus(p)) || 'pendente';}
function chaveMarcador(p){return p.rota+'|'+p.pedido+'|'+p.cliente;}
function focarPedido(p){
  const marcador=marcadoresPorPedido.get(chaveMarcador(p));
  if(marcador){
    map.setView(marcador.getLatLng(),17,{animate:true});
    marcador.openPopup();
  }else{
    map.setView([p.lat,p.lon],17,{animate:true});
  }
}
function alternarStatus(p){
  const novo=getStatus(p)==='atendido'?'pendente':'atendido';
  localStorage.setItem(chaveStatus(p),novo);
  renderPedidos(select.value);
  renderMapa(select.value);
}

function abrirPagamento(p){
  const tela=document.getElementById('pixTela');
  const conteudo=document.getElementById('pixConteudo');
  const info=dadosPix.get(normalizarCodigoCliente(p.cliente));
  if(!tela || !conteudo) return;
  if(!info){
    conteudo.innerHTML='<div class="pixAviso"><b>PIX não localizado para este cliente.</b><br><br>Código do cliente: '+esc(p.cliente)+'</div>';
  }else{
    const valor=Number(String(info.valor||'0').replace(',','.'))||0;
    conteudo.innerHTML='<div class="pixValorLabel">Valor do PIX</div>'+
      '<div class="pixValor">R$ '+valor.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})+'</div>'+
      '<div id="pixQr"></div>'+
      '<button id="pixCopiar" class="pixCopiar" type="button">Copiar código pix</button>'+
      '<p class="pixInstrucao">Utilize um aplicativo compatível para fazer a leitura do QR code</p>';
    const qr=document.getElementById('pixQr');
    if(qr && window.QRCode){
      new QRCode(qr,{text:info.payload,width:230,height:230,correctLevel:QRCode.CorrectLevel.M});
    }else if(qr){
      qr.innerHTML='<div class="pixAviso">Não foi possível gerar o QR Code.</div>';
    }

    const botaoCopiar=document.getElementById('pixCopiar');
    if(botaoCopiar){
      const codigoParaCopiar=info.enderecoPix || info.payload;
      botaoCopiar.onclick=async function(){
        const ok=await copiarCodigoPix(codigoParaCopiar);
        if(ok){
          const textoOriginal=this.textContent;
          this.textContent='Código copiado';
          this.classList.add('copiado');
          setTimeout(()=>{
            this.textContent=textoOriginal;
            this.classList.remove('copiado');
          },1600);
        }
      };
    }
  }
  tela.style.display='flex';
  tela.setAttribute('aria-hidden','false');
}


async function copiarCodigoPix(texto){
  if(!texto) return false;
  try{
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(texto);
      return true;
    }
  }catch(e){}
  try{
    const area=document.createElement('textarea');
    area.value=texto;
    area.setAttribute('readonly','');
    area.style.position='fixed';
    area.style.opacity='0';
    document.body.appendChild(area);
    area.select();
    const ok=document.execCommand('copy');
    document.body.removeChild(area);
    return ok;
  }catch(e){
    return false;
  }
}

function fecharPagamento(){
  const tela=document.getElementById('pixTela');
  if(!tela) return;
  tela.style.display='none';
  tela.setAttribute('aria-hidden','true');
}

function atualizarEstadoListaPedidos(){
  const box=document.getElementById('pedidos');
  if(!box) return;
  box.classList.toggle('minimizada',pedidosMinimizados);
  const botao=box.querySelector('.togglePedidos');
  if(botao){
    botao.textContent=pedidosMinimizados?'MOSTRAR':'MINIMIZAR';
    botao.setAttribute('aria-expanded',String(!pedidosMinimizados));
  }
}

function alternarListaPedidos(){
  pedidosMinimizados=!pedidosMinimizados;
  atualizarEstadoListaPedidos();
}

function renderPedidos(placa){
  const box=document.getElementById('pedidos');
  if(!placa){box.style.display='none';box.innerHTML='';return;}
  const itens=dados.filter(x=>x.rota===placa);
  box.innerHTML='<div class="pedidosCabecalho">'+
    '<div class="pedidosTitulo">Pedidos da rota</div>'+
    '<button type="button" class="togglePedidos" aria-expanded="'+String(!pedidosMinimizados)+'">'+(pedidosMinimizados?'MOSTRAR':'MINIMIZAR')+'</button>'+
    '</div>'+
    '<div class="pedidosConteudo">'+itens.map((p,i)=>{
    const st=getStatus(p);
    return '<div class="pedidoItem" data-i="'+i+'" title="Clique para localizar no mapa">'+
      '<div class="pedidoTopo"><span class="pedidoNum">Pedido '+esc(p.pedido)+' — '+esc(nomeFantasiaCliente(p.cliente))+'</span><span class="pedidoPeso">'+pesoNum(p.peso).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})+' kg</span></div>'+
      '<div>Cliente: '+esc(p.cliente)+' • '+esc(p.cidade)+'</div>'+
      '<div class="statusBtns">'+
      '<button class="statusBtn '+(st==='atendido'?'atendido':'pendente')+'" data-i="'+i+'">'+(st==='atendido'?'Atendido':'Pendente')+'</button>'+
      (dadosPix.has(normalizarCodigoCliente(p.cliente))
        ? '<button class="pagamentoBtn" data-i="'+i+'">Forma de Pagamento</button>'
        : '<button class="pagamentoBtn indisponivel" type="button" disabled>PIX indisponível</button>')+
      '</div></div>';
  }).join('')+'</div>';
  box.style.display='block';
  atualizarEstadoListaPedidos();
  const toggle=box.querySelector('.togglePedidos');
  if(toggle) toggle.onclick=(ev)=>{ev.stopPropagation();alternarListaPedidos();};
  box.querySelectorAll('.pedidoItem').forEach(item=>{
    item.onclick=()=>focarPedido(itens[Number(item.dataset.i)]);
  });
  box.querySelectorAll('.statusBtn').forEach(btn=>btn.onclick=(ev)=>{
    ev.stopPropagation();
    alternarStatus(itens[Number(btn.dataset.i)]);
  });
  box.querySelectorAll('.pagamentoBtn').forEach(btn=>btn.onclick=(ev)=>{
    ev.stopPropagation();
    abrirPagamento(itens[Number(btn.dataset.i)]);
  });
}

function renderMapa(placa){
  layer.clearLayers();
  marcadoresPorPedido.clear();
  if(!placa)return;
  const itens=dados.filter(x=>x.rota===placa);
  const bounds=[];
  const usadosPorCoordenada=new Map();

  itens.forEach((p,i)=>{
    const st=getStatus(p);
    const cor=st==='atendido'?'#148a2a':'#c00000';
    const icon=L.divIcon({className:'',html:'<div class="num" style="background:'+cor+'">'+esc(p.pedido)+'</div>',iconSize:[52,34],iconAnchor:[26,17]});
    const gps=p.gps || ('https://www.google.com/maps?q='+p.lat+','+p.lon);

    // Se mais de um pedido tiver exatamente a mesma localização,
    // afasta apenas o marcador visual para todos aparecerem.
    const chaveCoord=p.lat.toFixed(6)+'|'+p.lon.toFixed(6);
    const repeticao=usadosPorCoordenada.get(chaveCoord)||0;
    usadosPorCoordenada.set(chaveCoord,repeticao+1);

    let latVisual=p.lat;
    let lonVisual=p.lon;
    if(repeticao>0){
      const angulo=(repeticao-1)*(Math.PI*2/8);
      const raio=0.00018*(1+Math.floor((repeticao-1)/8));
      latVisual=p.lat + Math.cos(angulo)*raio;
      lonVisual=p.lon + Math.sin(angulo)*raio;
    }

    const popup='<div class="popup">'+
      '<b>Cliente:</b> '+esc(nomeFantasiaCliente(p.cliente))+'<br>'+
      '<b>Código do cliente:</b> '+esc(p.cliente)+'<br>'+
      '<b>Pedido:</b> '+esc(p.pedido)+'<br>'+
      '<b>Peso:</b> '+esc(p.peso)+' kg<br>'+
      '<a class="gps" target="_blank" rel="noopener" href="'+esc(gps)+'">ABRIR NO GPS</a></div>';

    const marcador=L.marker([latVisual,lonVisual],{icon}).bindPopup(popup).addTo(layer);
    marcadoresPorPedido.set(chaveMarcador(p),marcador);
    bounds.push([latVisual,lonVisual]);
  });
  if(bounds.length) map.fitBounds(bounds,{padding:[45,45]});
}

select.addEventListener('change',()=>{
  const placa=select.value;
  const info=document.getElementById('info');
  if(!placa){info.style.display='none';renderPedidos('');renderMapa('');return;}
  const itens=dados.filter(x=>x.rota===placa);
  if(!itens.length)return;
  const motorista=itens[0].motorista||'Não informado';
  const peso=itens.reduce((s,x)=>s+pesoNum(x.peso),0);
  const cidades=[...new Set(itens.map(x=>String(x.cidade||'').trim()).filter(Boolean))];
  info.innerHTML='<b>Motorista:</b> '+esc(motorista)+'<br><b>Entregas:</b> '+itens.length+
    '<br><b>Peso total:</b> '+peso.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})+' kg'+
    '<br><b>Cidade'+(cidades.length>1?'s':'')+':</b> '+(cidades.length?cidades.map(esc).join(', '):'Não informada');
  info.style.display='block';

  renderPedidos(placa);
  renderMapa(placa);
});
</script>

<script>
(function(){
  function prepararTelaInicial(){
    const selectAtual=document.getElementById('placa');
    const selectInicial=document.getElementById('placaInicial');
    const botao=document.getElementById('entrarRota');
    const tela=document.getElementById('telaInicial');
    if(!selectAtual || !selectInicial || !botao || !tela) return;

botao.addEventListener('click',function(){
      if(!selectInicial.value) return;
      pedidosMinimizados=true;
      selectAtual.value=selectInicial.value;
      selectAtual.dispatchEvent(new Event('change',{bubbles:true}));
      tela.style.display='none';
      setTimeout(function(){ if(window.map) map.invalidateSize(); },100);
    });

    const voltar=document.getElementById('trocarRota');
    if(voltar){
      voltar.addEventListener('click',function(){
        selectInicial.value='';
        botao.disabled=true;
        tela.style.display='flex';
      });
    }
    const pixFechar=document.getElementById('pixFechar');
    const pixTela=document.getElementById('pixTela');
    if(pixFechar) pixFechar.addEventListener('click',fecharPagamento);
    if(pixTela) pixTela.addEventListener('click',function(ev){ if(ev.target===pixTela) fecharPagamento(); });
  }
  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',function(){
      prepararTelaInicial();
      Promise.all([carregarPix(),carregarBaseClientes()]).then(carregarRotas);
    });
  }else{
    prepararTelaInicial();
    Promise.all([carregarPix(),carregarBaseClientes()]).then(carregarRotas);
  }
})();
</script>

<div id="offlineBar" class="offlineBar">Modo offline</div>

<script>
(function(){
  const DB_NAME='tgr_offline_db';
  const STORE='arquivos';
  const META='meta';

  function abrirDb(){
    return new Promise((resolve,reject)=>{
      const req=indexedDB.open(DB_NAME,2);
      req.onupgradeneeded=()=> {
        const db=req.result;
        if(!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE);
        if(!db.objectStoreNames.contains(META)) db.createObjectStore(META);
      };
      req.onsuccess=()=>resolve(req.result);
      req.onerror=()=>reject(req.error);
    });
  }

  async function salvarDb(store,chave,valor){
    const db=await abrirDb();
    return new Promise((resolve,reject)=>{
      const tx=db.transaction(store,'readwrite');
      tx.objectStore(store).put(valor,chave);
      tx.oncomplete=()=>resolve(true);
      tx.onerror=()=>reject(tx.error);
    });
  }

  async function lerDb(store,chave){
    const db=await abrirDb();
    return new Promise((resolve,reject)=>{
      const tx=db.transaction(store,'readonly');
      const req=tx.objectStore(store).get(chave);
      req.onsuccess=()=>resolve(req.result ?? null);
      req.onerror=()=>reject(req.error);
    });
  }

  async function salvarRespostaOffline(nome,resp){
    const clone=resp.clone();
    if(/\.xlsx$/i.test(nome)){
      const buf=await clone.arrayBuffer();
      const bytes=Array.from(new Uint8Array(buf));
      await salvarDb(STORE,nome,JSON.stringify({tipo:'bin',dados:bytes}));
    }else{
      const txt=await clone.text();
      await salvarDb(STORE,nome,JSON.stringify({tipo:'txt',dados:txt}));
    }
  }

  async function respostaOffline(nome){
    const salvo=await lerDb(STORE,nome);
    if(!salvo) return null;
    const obj=JSON.parse(salvo);
    if(obj.tipo==='bin'){
      return new Response(new Uint8Array(obj.dados),{
        status:200,
        headers:{'Content-Type':'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}
      });
    }
    return new Response(obj.dados,{
      status:200,
      headers:{'Content-Type':'text/plain; charset=utf-8'}
    });
  }

  const fetchOriginal=window.fetch.bind(window);
  window.fetch=async function(input,init){
    const url=typeof input==='string' ? input : (input && input.url ? input.url : '');
    const alvo=/(^|\/)(rotas\.csv|pix\.csv|Base de Clientes\.xlsx)(\?|$)/i.test(url);
    if(!alvo) return fetchOriginal(input,init);

    const nome=url.split('?')[0].split('/').pop();
    try{
      const resp=await fetchOriginal(input,init);
      if(resp && resp.ok) await salvarRespostaOffline(nome,resp);
      return resp;
    }catch(e){
      const offline=await respostaOffline(nome);
      if(offline) return offline;
      throw e;
    }
  };

  function formatarDataHora(iso){
    if(!iso) return 'ainda não realizada';
    const d=new Date(iso);
    if(Number.isNaN(d.getTime())) return iso;
    return d.toLocaleString('pt-BR');
  }

  async function atualizarTextoUltimaAtualizacao(){
    const el=document.getElementById('atualizacaoInfo');
    if(!el) return;
    const iso=await lerDb(META,'ultimaAtualizacao');
    el.className='atualizacaoInfo';
    el.textContent='Última atualização: '+formatarDataHora(iso);
  }

  async function baixarArquivo(nome){
    const resp=await fetchOriginal(nome+'?atualizar='+Date.now(),{cache:'no-store'});
    if(!resp.ok) throw new Error(nome+' HTTP '+resp.status);
    await salvarRespostaOffline(nome,resp);
    return true;
  }

  async function atualizarRotaDoDia(){
    const btn=document.getElementById('atualizarRotaBtn');
    const info=document.getElementById('atualizacaoInfo');
    if(!btn || !info) return;

    if(!navigator.onLine){
      info.className='atualizacaoInfo atualizacaoErro';
      info.textContent='Sem internet. Não foi possível atualizar.';
      return;
    }

    const textoOriginal=btn.textContent;
    btn.disabled=true;
    btn.textContent='Atualizando...';
    info.className='atualizacaoInfo';
    info.textContent='Baixando dados mais recentes...';

    try{
      await baixarArquivo('rotas.csv');
      await baixarArquivo('pix.csv');

      try{ await baixarArquivo('Base de Clientes.xlsx'); }catch(e){}

      const agora=new Date().toISOString();
      await salvarDb(META,'ultimaAtualizacao',agora);

      info.className='atualizacaoInfo atualizacaoOk';
      info.textContent='Rota atualizada com sucesso • '+formatarDataHora(agora);

      // Recarrega a aplicação para que a nova rota apareça imediatamente.
      setTimeout(()=>location.reload(),900);
    }catch(e){
      console.error(e);
      info.className='atualizacaoInfo atualizacaoErro';
      info.textContent='Falha na atualização. Verifique a internet e tente novamente.';
      btn.disabled=false;
      btn.textContent=textoOriginal;
    }
  }

  function atualizarOfflineBar(){
    const el=document.getElementById('offlineBar');
    if(!el) return;
    el.classList.toggle('on',!navigator.onLine);
  }

  function prepararBotaoAtualizacao(){
    const box=document.getElementById('atualizarRotaBox');
    const btn=document.getElementById('atualizarRotaBtn');
    if(box) box.style.display='block';
    if(btn) btn.addEventListener('click',atualizarRotaDoDia);
    atualizarTextoUltimaAtualizacao();
  }

  window.addEventListener('online',atualizarOfflineBar);
  window.addEventListener('offline',atualizarOfflineBar);

  document.addEventListener('DOMContentLoaded',()=>{
    atualizarOfflineBar();
    prepararBotaoAtualizacao();
  });

  if('serviceWorker' in navigator){
    window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
  }
})();
</script>
