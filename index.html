<style>

.pedidoTopo{display:flex;justify-content:space-between;gap:8px;align-items:center}
.pedidoNum{font-weight:bold;color:#c00000;font-size:13px}
.pedidoPeso{font-weight:bold}
.statusBtns{display:flex;gap:8px;margin-top:7px}
.statusBtn,.pagamentoBtn{width:50%;border:0;border-radius:6px;padding:9px;font-weight:bold;cursor:pointer;color:#fff}

.pagamentoBtn{background:#555}
.pagamentoBtn.indisponivel{background:#aaa;color:#f7f7f7;cursor:default}
.statusBtn.atendido{background:#148a2a}
.statusBtn.pendente{background:#777}
.num{background:#c00000;color:#fff;border:2px solid #fff;border-radius:16px;min-width:34px;height:30px;padding:0 5px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;font-weight:bold;box-shadow:0 1px 5px #0008}
.popup{font-size:13px;line-height:1.45;min-width:180px}
.gps{display:block;text-align:center;text-decoration:none;background:#148a2a;color:white!important;font-weight:bold;padding:9px;margin-top:8px;border-radius:7px}
@media(max-width:600px){.topo{left:8px;right:auto;top:8px;width:calc(100vw - 16px);max-width:none}}
.pixTela{position:fixed;inset:0;z-index:12000;background:#f4f4f4;display:none;align-items:center;justify-content:center;padding:18px;box-sizing:border-box}
.pixCard{width:min(430px,100%);background:#fff;border-radius:16px;padding:22px;box-shadow:0 8px 30px #0003;text-align:center}
.pixTopo{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.pixTopo h2{margin:0;font-size:18px;color:#222}
.pixFechar{border:1px solid #bbb;background:#fff;border-radius:7px;padding:8px 11px;font-weight:bold;cursor:pointer}
.pixValorLabel{font-size:13px;color:#666;margin-bottom:4px}
.pixValor{font-size:28px;font-weight:bold;color:#148a2a;margin-bottom:18px}
#pixQr{display:flex;align-items:center;justify-content:center;min-height:230px;margin:0 auto 14px}
#pixQr img,#pixQr canvas{max-width:230px!important;width:230px!important;height:230px!important}
.pixInstrucao{font-size:13px;line-height:1.45;color:#555;margin:0 auto;max-width:310px}
.pixAviso{font-size:14px;color:#b00000;line-height:1.45;padding:30px 10px}


  #telaInicial{
    position:fixed; inset:0; z-index:9999; background:#f4f4f4;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .inicioCard{
    width:min(430px,100%); background:#fff; border-radius:16px; padding:28px 22px;
    box-shadow:0 8px 30px rgba(0,0,0,.18); text-align:center;
  }
  .inicioCard h1{margin:0 0 8px;font-size:23px}
  .inicioCard p{margin:0 0 20px;color:#666;font-size:13px}
  .inicioCard select{width:100%;padding:12px;border:1px solid #bbb;border-radius:8px;font-size:14px;background:#fff}
  .inicioCard button{width:100%;margin-top:12px;padding:12px;border:0;border-radius:8px;background:#c00000;color:#fff;font-weight:700;font-size:14px;cursor:pointer}
  .inicioCard button:disabled{opacity:.45;cursor:not-allowed}
  #trocarRota{position:fixed;top:12px;right:12px;z-index:1100;margin:0;padding:6px 9px;border:1px solid #bbb;border-radius:7px;background:rgba(255,255,255,.92);color:#555;font-size:10px;font-weight:bold;cursor:pointer;box-shadow:0 1px 5px #0002}

</style>
</head>
<body>
<div id="telaInicial">
  <div class="inicioCard">
    <h1>Rotas TGR</h1>
    <p>Selecione a placa do veículo para acessar a rota.</p>
    <select id="placaInicial">
      <option value="">Selecione a placa...</option>
    </select>
    <button id="entrarRota" disabled>ABRIR ROTA</button>
  </div>
</div>

<div id="map"></div>
<div class="topo">
  <h2>Rotas TGR</h2>
  <div style="display:none"><select id="placa"><option value="">Selecione a placa...</option></select></div>
  <div id="info" class="info"></div>
<button id="trocarRota" type="button">VOLTAR</button>
  <div id="pedidos" class="pedidos"></div>
</div>

<div id="pixTela" class="pixTela" aria-hidden="true">
  <div class="pixCard">
    <div class="pixTopo">
      <h2>Forma de Pagamento</h2>
      <button id="pixFechar" class="pixFechar" type="button">FECHAR</button>
    </div>
    <div id="pixConteudo"></div>
  </div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
let dados=[];
let dadosPix=new Map();

function parseCSV(texto){
  const linhas=[];
  let linha=[], campo='', aspas=false;
  for(let i=0;i<texto.length;i++){
    const c=texto[i];
    if(c==='"'){
      if(aspas && texto[i+1]==='"'){campo+='"'; i++;}
      else aspas=!aspas;
    }else if(c===';' && !aspas){
      linha.push(campo); campo='';
    }else if((c==='\n'||c==='\r') && !aspas){
      if(c==='\r' && texto[i+1]==='\n') i++;
      linha.push(campo); campo='';
      if(linha.some(v=>v!=='')) linhas.push(linha);
      linha=[];
    }else{
      campo+=c;
    }
  }
  if(campo!=='' || linha.length){
    linha.push(campo);
    if(linha.some(v=>v!=='')) linhas.push(linha);
  }
  return linhas;
}

function normalizarCodigoCliente(v){
  return String(v??'').trim().toUpperCase();
}

async function carregarPix(){
  try{
    const resposta=await fetch('pix.csv?v='+Date.now(),{cache:'no-store'});
    if(!resposta.ok) throw new Error('HTTP '+resposta.status);
    let texto=(await resposta.text()).replace(/^\uFEFF/,'');
    const linhas=parseCSV(texto);
    if(linhas.length<2) return;
    const cab=linhas[0].map(x=>x.trim());
    const idx=nome=>cab.indexOf(nome);
    const pos={
      cliente:idx('CODIGO CLIENTE'),
      nf:idx('NF'),
      valor:idx('VALOR PIX'),
      payload:idx('PIX COPIA E COLA')
    };
    if(Object.values(pos).some(v=>v<0)) return;
    dadosPix.clear();
    linhas.slice(1).forEach(cols=>{
      const cliente=normalizarCodigoCliente(cols[pos.cliente]);
      const payload=String(cols[pos.payload]??'').trim();
      if(!cliente || !payload) return;
      if(!dadosPix.has(cliente)){
        dadosPix.set(cliente,{
          nf:String(cols[pos.nf]??'').trim(),
          valor:String(cols[pos.valor]??'').trim(),
          payload
        });
      }
    });
  }catch(erro){
    console.warn('pix.csv não carregado:',erro);
  }
}

async function carregarRotas(){
  try{
    const resposta=await fetch('rotas.csv?v='+Date.now(),{cache:'no-store'});
    if(!resposta.ok) throw new Error('HTTP '+resposta.status);

    let texto=(await resposta.text()).replace(/^\uFEFF/,'');
    const linhas=parseCSV(texto);
    if(linhas.length<2) throw new Error('CSV vazio.');

    const cab=linhas[0].map(x=>x.trim());
    const idx=nome=>cab.indexOf(nome);
    const pos={
      cliente:idx('CODIGO DO CLIENTE'),
      pedido:idx('NUMERO DO PEDIDO'),
      peso:idx('PESO'),
      rota:idx('ROTA'),
      motorista:idx('MOTORISTA'),
      cidade:idx('CIDADE'),
      lat:idx('LATITUDE'),
      lon:idx('LONGITUDE'),
      gps:idx('LINK GPS'),
      status:idx('STATUS DO PEDIDO')
    };

    const faltando=Object.entries(pos).filter(([k,v])=>v<0).map(([k])=>k);
    if(faltando.length) throw new Error('Colunas ausentes no CSV: '+faltando.join(', '));

    dados=linhas.slice(1).map(cols=>({
      cliente:String(cols[pos.cliente]??'').trim(),
      pedido:String(cols[pos.pedido]??'').trim(),
      peso:String(cols[pos.peso]??'').trim(),
      rota:String(cols[pos.rota]??'').trim(),
      motorista:String(cols[pos.motorista]??'').trim(),
      cidade:String(cols[pos.cidade]??'').trim(),
      lat:Number(String(cols[pos.lat]??'').replace(',','.')),
      lon:Number(String(cols[pos.lon]??'').replace(',','.')),
      gps:String(cols[pos.gps]??'').trim(),
      status:String(cols[pos.status]??'').trim()
    })).filter(x=>
      x.rota &&
      x.status.toLowerCase()==='roteirizado' &&
      Number.isFinite(x.lat) &&
      Number.isFinite(x.lon)
    );

    preencherPlacas();
  }catch(erro){
    const tela=document.getElementById('telaInicial');
    if(tela){
      tela.innerHTML='<div class="inicioCard"><h1>Rotas TGR</h1>'+
        '<p style="color:#b00000"><b>Não foi possível carregar rotas.csv.</b></p>'+
        '<p>Confirme se <b>index.html</b> e <b>rotas.csv</b> estão na mesma pasta publicada.</p>'+
        '<p style="font-size:12px;color:#666">'+esc(erro.message)+'</p></div>';
    }
  }
}

function preencherPlacas(){
  select.innerHTML='<option value="">Selecione a placa...</option>';
  const placas=[...new Set(dados.map(x=>x.rota))].sort();
  placas.forEach(p=>{
    const item=dados.find(x=>x.rota===p);
    const o=document.createElement('option');
    o.value=p;
    o.textContent=p+' — '+((item&&item.motorista)?item.motorista:'Não informado');
    select.appendChild(o);
  });

  const selectInicial=document.getElementById('placaInicial');
  const botao=document.getElementById('entrarRota');
  if(selectInicial && botao){
    selectInicial.innerHTML='<option value="">Selecione a placa...</option>';
    placas.forEach(p=>{
      const item=dados.find(x=>x.rota===p);
      const o=document.createElement('option');
      o.value=p;
      o.textContent=p+' — '+((item&&item.motorista)?item.motorista:'Não informado');
      selectInicial.appendChild(o);
    });
    selectInicial.onchange=function(){botao.disabled=!this.value;};
  }
}

const map=L.map('map').setView([-11.30,-41.85],9);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxZoom:19,attribution:'&copy; OpenStreetMap'
}).addTo(map);
let layer=L.layerGroup().addTo(map);
let marcadoresPorPedido=new Map();
let pedidosMinimizados=true;

const select=document.getElementById('placa');

map.on('click',()=>{
  if(select.value && !pedidosMinimizados){
    pedidosMinimizados=true;
    atualizarEstadoListaPedidos();
  }
});

function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function pesoNum(v){return Number(String(v??'0').replace(',','.'))||0;}
function chaveStatus(p){return 'statusPedidoTGR|'+p.rota+'|'+p.pedido+'|'+p.cliente;}
function getStatus(p){return localStorage.getItem(chaveStatus(p)) || 'pendente';}
function chaveMarcador(p){return p.rota+'|'+p.pedido+'|'+p.cliente;}
function focarPedido(p){
  const marcador=marcadoresPorPedido.get(chaveMarcador(p));
  if(marcador){
    map.setView(marcador.getLatLng(),17,{animate:true});
    marcador.openPopup();
  }else{
    map.setView([p.lat,p.lon],17,{animate:true});
  }
}
function alternarStatus(p){
  const novo=getStatus(p)==='atendido'?'pendente':'atendido';
  localStorage.setItem(chaveStatus(p),novo);
  renderPedidos(select.value);
  renderMapa(select.value);
}

function abrirPagamento(p){
  const tela=document.getElementById('pixTela');
  const conteudo=document.getElementById('pixConteudo');
  const info=dadosPix.get(normalizarCodigoCliente(p.cliente));
  if(!tela || !conteudo) return;
  if(!info){
    conteudo.innerHTML='<div class="pixAviso"><b>PIX não localizado para este cliente.</b><br><br>Código do cliente: '+esc(p.cliente)+'</div>';
  }else{
    const valor=Number(String(info.valor||'0').replace(',','.'))||0;
    conteudo.innerHTML='<div class="pixValorLabel">Valor do PIX</div>'+
      '<div class="pixValor">R$ '+valor.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})+'</div>'+
      '<div id="pixQr"></div>'+
      '<p class="pixInstrucao">Utilize um aplicativo compatível para fazer a leitura do QR code</p>';
    const qr=document.getElementById('pixQr');
    if(qr && window.QRCode){
      new QRCode(qr,{text:info.payload,width:230,height:230,correctLevel:QRCode.CorrectLevel.M});
    }else if(qr){
      qr.innerHTML='<div class="pixAviso">Não foi possível gerar o QR Code.</div>';
    }
  }
  tela.style.display='flex';
  tela.setAttribute('aria-hidden','false');
}

function fecharPagamento(){
  const tela=document.getElementById('pixTela');
  if(!tela) return;
  tela.style.display='none';
  tela.setAttribute('aria-hidden','true');
}

function atualizarEstadoListaPedidos(){
  const box=document.getElementById('pedidos');
  if(!box) return;
  box.classList.toggle('minimizada',pedidosMinimizados);
  const botao=box.querySelector('.togglePedidos');
  if(botao){
    botao.textContent=pedidosMinimizados?'MOSTRAR':'MINIMIZAR';
    botao.setAttribute('aria-expanded',String(!pedidosMinimizados));
  }
}

function alternarListaPedidos(){
  pedidosMinimizados=!pedidosMinimizados;
  atualizarEstadoListaPedidos();
}

function renderPedidos(placa){
  const box=document.getElementById('pedidos');
  if(!placa){box.style.display='none';box.innerHTML='';return;}
  const itens=dados.filter(x=>x.rota===placa);
  box.innerHTML='<div class="pedidosCabecalho">'+
    '<div class="pedidosTitulo">Pedidos da rota</div>'+
    '<button type="button" class="togglePedidos" aria-expanded="'+String(!pedidosMinimizados)+'">'+(pedidosMinimizados?'MOSTRAR':'MINIMIZAR')+'</button>'+
    '</div>'+
    '<div class="pedidosConteudo">'+itens.map((p,i)=>{
    const st=getStatus(p);
    return '<div class="pedidoItem" data-i="'+i+'" title="Clique para localizar no mapa">'+
      '<div class="pedidoTopo"><span class="pedidoNum">Pedido '+esc(p.pedido)+'</span><span class="pedidoPeso">'+pesoNum(p.peso).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})+' kg</span></div>'+
      '<div>Cliente: '+esc(p.cliente)+' • '+esc(p.cidade)+'</div>'+
      '<div class="statusBtns">'+
      '<button class="statusBtn '+(st==='atendido'?'atendido':'pendente')+'" data-i="'+i+'">'+(st==='atendido'?'Atendido':'Pendente')+'</button>'+
      (dadosPix.has(normalizarCodigoCliente(p.cliente))
        ? '<button class="pagamentoBtn" data-i="'+i+'">Forma de Pagamento</button>'
        : '<button class="pagamentoBtn indisponivel" type="button" disabled>PIX indisponível</button>')+
      '</div></div>';
  }).join('')+'</div>';
  box.style.display='block';
  atualizarEstadoListaPedidos();
  const toggle=box.querySelector('.togglePedidos');
  if(toggle) toggle.onclick=(ev)=>{ev.stopPropagation();alternarListaPedidos();};
  box.querySelectorAll('.pedidoItem').forEach(item=>{
    item.onclick=()=>focarPedido(itens[Number(item.dataset.i)]);
  });
  box.querySelectorAll('.statusBtn').forEach(btn=>btn.onclick=(ev)=>{
    ev.stopPropagation();
    alternarStatus(itens[Number(btn.dataset.i)]);
  });
  box.querySelectorAll('.pagamentoBtn').forEach(btn=>btn.onclick=(ev)=>{
    ev.stopPropagation();
    abrirPagamento(itens[Number(btn.dataset.i)]);
  });
}

function renderMapa(placa){
  layer.clearLayers();
  marcadoresPorPedido.clear();
  if(!placa)return;
  const itens=dados.filter(x=>x.rota===placa);
  const bounds=[];
  const usadosPorCoordenada=new Map();

  itens.forEach((p,i)=>{
    const st=getStatus(p);
    const cor=st==='atendido'?'#148a2a':'#c00000';
    const icon=L.divIcon({className:'',html:'<div class="num" style="background:'+cor+'">'+esc(p.pedido)+'</div>',iconSize:[52,34],iconAnchor:[26,17]});
    const gps=p.gps || ('https://www.google.com/maps?q='+p.lat+','+p.lon);

    // Se mais de um pedido tiver exatamente a mesma localização,
    // afasta apenas o marcador visual para todos aparecerem.
    const chaveCoord=p.lat.toFixed(6)+'|'+p.lon.toFixed(6);
    const repeticao=usadosPorCoordenada.get(chaveCoord)||0;
    usadosPorCoordenada.set(chaveCoord,repeticao+1);

    let latVisual=p.lat;
    let lonVisual=p.lon;
    if(repeticao>0){
      const angulo=(repeticao-1)*(Math.PI*2/8);
      const raio=0.00018*(1+Math.floor((repeticao-1)/8));
      latVisual=p.lat + Math.cos(angulo)*raio;
      lonVisual=p.lon + Math.sin(angulo)*raio;
    }

    const popup='<div class="popup">'+
      '<b>Cliente:</b> '+esc(p.cliente)+'<br>'+
      '<b>Pedido:</b> '+esc(p.pedido)+'<br>'+
      '<b>Cidade:</b> '+esc(p.cidade)+'<br>'+
      '<b>Peso:</b> '+esc(p.peso)+' kg<br>'+
      '<b>Status:</b> '+(st==='atendido'?'Atendido':'Pendente')+'<br>'+
      '<a class="gps" target="_blank" rel="noopener" href="'+esc(gps)+'">ABRIR NO GPS</a></div>';

    const marcador=L.marker([latVisual,lonVisual],{icon}).bindPopup(popup).addTo(layer);
    marcadoresPorPedido.set(chaveMarcador(p),marcador);
    bounds.push([latVisual,lonVisual]);
  });
  if(bounds.length) map.fitBounds(bounds,{padding:[45,45]});
}

select.addEventListener('change',()=>{
  const placa=select.value;
  const info=document.getElementById('info');
  if(!placa){info.style.display='none';renderPedidos('');renderMapa('');return;}
  const itens=dados.filter(x=>x.rota===placa);
  if(!itens.length)return;
  const motorista=itens[0].motorista||'Não informado';
  const peso=itens.reduce((s,x)=>s+pesoNum(x.peso),0);
  const cidades=[...new Set(itens.map(x=>String(x.cidade||'').trim()).filter(Boolean))];
  info.innerHTML='<b>Motorista:</b> '+esc(motorista)+'<br><b>Entregas:</b> '+itens.length+
    '<br><b>Peso total:</b> '+peso.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})+' kg'+
    '<br><b>Cidade'+(cidades.length>1?'s':'')+':</b> '+(cidades.length?cidades.map(esc).join(', '):'Não informada');
  info.style.display='block';

  renderPedidos(placa);
  renderMapa(placa);
});
</script>

<script>
(function(){
  function prepararTelaInicial(){
    const selectAtual=document.getElementById('placa');
    const selectInicial=document.getElementById('placaInicial');
    const botao=document.getElementById('entrarRota');
    const tela=document.getElementById('telaInicial');
    if(!selectAtual || !selectInicial || !botao || !tela) return;

botao.addEventListener('click',function(){
      if(!selectInicial.value) return;
      pedidosMinimizados=true;
      selectAtual.value=selectInicial.value;
      selectAtual.dispatchEvent(new Event('change',{bubbles:true}));
      tela.style.display='none';
      setTimeout(function(){ if(window.map) map.invalidateSize(); },100);
    });

    const voltar=document.getElementById('trocarRota');
    if(voltar){
      voltar.addEventListener('click',function(){
        selectInicial.value='';
        botao.disabled=true;
        tela.style.display='flex';
      });
    }
    const pixFechar=document.getElementById('pixFechar');
    const pixTela=document.getElementById('pixTela');
    if(pixFechar) pixFechar.addEventListener('click',fecharPagamento);
    if(pixTela) pixTela.addEventListener('click',function(ev){ if(ev.target===pixTela) fecharPagamento(); });
  }
  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',function(){
      prepararTelaInicial();
      carregarPix();
      carregarRotas();
    });
  }else{
